name: release

on:
  push:
    tags: [ "v*" ]

# deleting the release tag and creating the GitHub release both need write access
permissions:
  contents: write

# run only one release action at a time for the repo, wait for the previous to finish before running another one
concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}
  # by default only one run can be pending, an older pending run gets cancelled and leaves its tag behind
  queue: max

jobs:
  publish:
    runs-on: ubuntu-latest
    # a timed out job is cancelled instead of hanging for the default 6 hours,
    # see the tag deletion step for what happens to the release tag then
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch all history for all branches and tags - just in case it's all necessary for ci-release.
          # Tags are needed for versionPolicyCheck binary and source compat checks.
          fetch-depth: 0
          # don't leave the write token in the git config where the build and its plugins can read it
          persist-credentials: false
      # No dependency caches here: caches written by main branch CI runs are restorable by tag runs,
      # so anything that gets to run in CI could plant code into the job holding the publishing secrets.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version-file: .java-version
          distribution: temurin
      # setup-sbt has no option to disable restoring the sbt runner itself from the cache
      - uses: sbt/setup-sbt@b113b960ba361e87e08ce02a390d51871b7ee459 # v1.5.13
        with:
          disk-cache: false
      # sbt ci-release doesn't verify the build, need to do it explicitly
      - name: sbt build
        run: sbt clean buildFull
      - id: ci-release
        run: sbt ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}

      # A cancellation (manual or by the timeout) during sbt ci-release can come after the bundle got uploaded,
      # and Maven Central then publishes the version anyway - the tag is kept to point at the published commit.
      - name: delete release tag if failed
        if: failure() || (cancelled() && steps.ci-release.outcome == 'skipped')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag"

      - name: publish release notes
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
        run: |
          gh release create "$tag" \
              --repo="$GITHUB_REPOSITORY" \
              --title="v${tag#v}" \
              --generate-notes
