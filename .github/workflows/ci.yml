name: ci

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  ci-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch all history for all branches and tags.
          # Tags are needed for versionPolicyCheck binary and source compat checks.
          # In a shallow clone the previous release tag isn't reachable from HEAD and the checks are silently skipped.
          fetch-depth: 0
          persist-credentials: false
      - uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version-file: .java-version
          distribution: temurin
          cache: sbt
      - uses: sbt/setup-sbt@b113b960ba361e87e08ce02a390d51871b7ee459 # v1.5.13
      - name: sbt build
        run: sbt clean buildFull
